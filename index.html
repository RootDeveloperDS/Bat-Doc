<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATDOC — Battery Intelligence Diagnostic</title>
  <link rel="stylesheet" href="src/styles.css">
  <style>
    /* Inline Fallback / Reset */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="url(#brand_grad)" />
          <rect x="10" y="14" width="18" height="12" rx="2.5" stroke="#ffffff" stroke-width="2" />
          <path d="M30 18V22" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
          <path d="M20 10L14 21H20L18 30L26 18H20L22 10Z" fill="#ffffff" />
          <defs>
            <linearGradient id="brand_grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0284c7" />
              <stop offset="1" stop-color="#0369a1" />
            </linearGradient>
          </defs>
        </svg>
        <div>
          <h1 class="brand-title">BATDOC <span class="brand-badge">PRO DIAGNOSTIC</span></h1>
          <p class="brand-tagline">100% Grounded Windows Battery Intelligence Diagnostic</p>
        </div>
      </div>
      <div id="header-actions" class="header-actions no-print">
        <label for="file-input" class="btn btn-secondary text-xs" style="cursor: pointer;">
          Select Report File
          <input type="file" id="file-input" accept=".html,.htm" style="display:none;">
        </label>
      </div>
    </header>

    <!-- Dropzone View (Visible when no data loaded) -->
    <div id="dropzone-view" class="dropzone no-print">
      <div style="display:flex; justify-content:center; margin-bottom:1.25rem;">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" />
        </svg>
      </div>
      <h2 style="font-size:1.25rem; font-weight:800; color:#0f172a; margin-bottom:0.35rem;">Drag and drop your battery-report.html here</h2>
      <p style="font-size:0.875rem; color:#64748b; margin-bottom:1.5rem;">100% Client-Side & Offline. Zero network calls, zero tracking.</p>
      <div style="display:inline-flex; gap:0.75rem;">
        <button onclick="document.getElementById('file-input').click()" class="btn btn-primary">Browse Local Report</button>
        <button onclick="window.loadSampleReport()" class="btn btn-secondary">Explore Sample Report</button>
      </div>
      <div style="margin-top:2rem; font-size:0.8rem; color:#94a3b8; max-width:480px; margin-left:auto; margin-right:auto;">
        Generated via Windows PowerShell or CMD: <code style="background:#f1f5f9; padding:0.2rem 0.5rem; border-radius:6px; color:#334155;">powercfg /batteryreport</code>
      </div>
    </div>

    <!-- Dashboard View (Populated upon parse) -->
    <main id="dashboard-view" style="display:none;"></main>
  </div>

  <!-- Raw Report Injected Placeholder for 1-Click Batch Execution (Base64 Encoded) -->
  <script id="embedded-report-base64" type="text/plain">__RAW_REPORT_BASE64_PAYLOAD__</script>

  <script type="module">
    import { parseBatteryReport } from './src/parser.js';
    import { analyzeBatteryReport } from './src/analytics.js';
    import { renderDashboard } from './src/ui.js';

    window.switchTab = function(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.segmented-btn, .tab-btn').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(tabId);
      if (target) target.style.display = 'block';
      const btns = document.querySelectorAll('.segmented-btn, .tab-btn');
      btns.forEach(btn => {
        if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(tabId)) {
          btn.classList.add('active');
        }
      });
    };

    window.decodeBase64Utf8 = function(b64) {
      const binaryString = atob(b64.trim());
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return new TextDecoder('utf-8').decode(bytes);
    };

    window.loadReportHTML = function(htmlText) {
      try {
        const data = parseBatteryReport(htmlText);
        const analysis = analyzeBatteryReport(data);
        const dashboardHtml = renderDashboard(data, analysis);

        document.getElementById('dropzone-view').style.display = 'none';
        const dash = document.getElementById('dashboard-view');
        dash.innerHTML = dashboardHtml;
        dash.style.display = 'block';

        // Update header action to clean re-select trigger
        const headerActions = document.getElementById('header-actions');
        if (headerActions) {
          headerActions.innerHTML = `
            <label for="file-input-reselect" class="btn btn-secondary" style="cursor: pointer; font-size: 0.8rem; padding: 0.45rem 0.9rem;">
              Analyze Another Report
              <input type="file" id="file-input-reselect" accept=".html,.htm" style="display:none;">
            </label>
          `;
          document.getElementById('file-input-reselect').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (event) => window.loadReportHTML(event.target.result);
              reader.readAsText(file);
            }
          });
        }
      } catch (err) {
        alert('Error parsing battery report: ' + err.message);
      }
    };

    window.loadSampleReport = async function() {
      try {
        const resp = await fetch('sample/battery-report.html');
        if (resp.ok) {
          const text = await resp.text();
          window.loadReportHTML(text);
        } else {
          alert('Sample file not found. Please drag and drop your own battery-report.html.');
        }
      } catch (e) {
        alert('Could not fetch sample. Please drop your battery-report.html file.');
      }
    };

    // Auto-load if raw data was injected as Base64 by batch script
    document.addEventListener('DOMContentLoaded', () => {
      const b64Script = document.getElementById('embedded-report-base64');
      if (b64Script && b64Script.textContent.trim().length > 100 && !b64Script.textContent.includes('PAYLOAD')) {
        try {
          const rawHtml = window.decodeBase64Utf8(b64Script.textContent);
          window.loadReportHTML(rawHtml);
        } catch (e) {
          console.error('Failed to decode embedded report data', e);
        }
      }
    });

    // File input handler
    const fileInput = document.getElementById('file-input');
    if (fileInput) {
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => window.loadReportHTML(event.target.result);
          reader.readAsText(file);
        }
      });
    }

    // Drag and drop handlers
    const dropzone = document.getElementById('dropzone-view');
    ['dragenter', 'dragover'].forEach(name => {
      dropzone.addEventListener(name, (e) => { e.preventDefault(); dropzone.classList.add('drag-active'); });
    });
    ['dragleave', 'drop'].forEach(name => {
      dropzone.addEventListener(name, (e) => { e.preventDefault(); dropzone.classList.remove('drag-active'); });
    });
    dropzone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => window.loadReportHTML(event.target.result);
        reader.readAsText(file);
      }
    });
  </script>
</body>
</html>
